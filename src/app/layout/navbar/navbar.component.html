<header class="navbar">

  <div class="navbar-left">
    <button class="icon-btn menu-toggle" (click)="onMenuToggle()" aria-label="Toggle menu">
      <span class="material-icons">menu</span>
    </button>
  </div>

  <div class="navbar-center">
    <div class="source-stat">
      <span class="source-dot dot-sofascore"></span>
      <span class="source-label">Sofascore</span>
      <span class="source-count">{{ sofascoreCount() }}</span>
    </div>
    <div class="source-divider"></div>
    <div class="source-stat">
      <span class="source-dot dot-livescore"></span>
      <span class="source-label">Livescore</span>
      <span class="source-count">{{ livescoreCount() }}</span>
    </div>
  </div>

  <div class="navbar-right">
    <button class="icon-btn theme-toggle" (click)="themeSvc.toggle()" [title]="themeSvc.isDark() ? 'Modo claro' : 'Modo oscuro'" aria-label="Toggle theme">
      <span class="material-icons">{{ themeSvc.isDark() ? 'light_mode' : 'dark_mode' }}</span>
    </button>
  </div>

</header>
